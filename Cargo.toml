[package]
name = "rustos"
version = "0.1.0"
edition = "2021"

# El kernel no enlaza la biblioteca estándar.
[[bin]]
name = "rustos"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
# etapa 1
uart_16550 = "0.3"
# etapa 1  bootloader = "0.9"
volatile = "0.4"
spin = "0.9"
# etapa 3
x86_64 = "0.15"
# etapa 4  pic8259 = "0.10"


[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04"]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}", "-serial", "stdio"]
